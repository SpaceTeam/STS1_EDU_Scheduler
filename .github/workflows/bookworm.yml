name: Compile for the RPi

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: rust:1-bookworm

    steps:
      - name: Install ARM64 compiler
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            pkg-config

      - name: Install ARM64 Rust target
        run: |
          rustup target add aarch64-unknown-linux-gnu

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build \
            --examples \
            --bins \
            --release \
            --target aarch64-unknown-linux-gnu

      - name: Verify glibc requirements
        run: |
          strings target/aarch64-unknown-linux-gnu/release/STS1_EDU_Scheduler \
            | grep -E '^GLIBC_[0-9]' \
            | sort -V \
            | tail

      - name: Prepare package
        run: |
          mv target/aarch64-unknown-linux-gnu/release/STS1_EDU_Scheduler .
          mv target/aarch64-unknown-linux-gnu/release/examples/cli .
          mv target/aarch64-unknown-linux-gnu/release/examples/simple-archive ./sa
          cp scheduler/config.toml .
          cp scheduler/scheduler.service .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-bookworm-package
          path: |
            STS1_EDU_Scheduler
            config.toml
            scheduler.service
            cli
            sa